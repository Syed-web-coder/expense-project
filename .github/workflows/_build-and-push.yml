# .github/workflows/_build-and-push.yml
# Reusable workflow: build + Trivy + push to ECR via OIDC.
# Called from ci.yml on main; never invoked directly by a UI dispatch.
#
# Task 2 status: build half only (composite action + buildx + local build).
# Trivy scan + AWS OIDC + ECR push land in Task 3.
name: _build-and-push

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      image-name:
        required: true
        type: string
      ecr-repo:
        required: true
        type: string

# No permissions block here — the caller's job-level block is what gets
# applied. Documenting that with a comment so the next reader knows.

jobs:
  build-scan-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: build-push-${{ inputs.app-name }}
      cancel-in-progress: false
    steps:
      - name: Set up build env (composite)
        uses: ./.github/actions/setup-build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build image (load to local docker for scan)
        id: build-local
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # v6.9.0
        with:
          context: .
          load:    true
          tags: ${{ inputs.image-name }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
