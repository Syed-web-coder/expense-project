# .github/workflows/ci.yml
name: expense-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR force-pushes cancel stale runs; main pushes serialise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Top-level default: read-only. Individual jobs widen as needed.
permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (expense-api)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (required to load local composite action)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up build env (composite)
        uses: ./.github/actions/setup-build

      - name: Gradle build + tests
        env:
          # Safety net: a local Colima+Ryuk timeout was observed during
          # development (possibly a Colima-VM-specific quirk, not
          # confirmed to reproduce here) -- CI runners are torn down
          # after each job anyway, making Ryuk's cleanup role redundant.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ./gradlew --no-daemon build
      - name: Guard against HINCRBYFLOAT in cost package
        run: |
          if grep -rIn 'HINCRBYFLOAT\|hincrByFloat' src/main/java/com/uptimecrew/expense/llmproxy/cost/; then
            echo "::error::HINCRBYFLOAT/hincrByFloat found in cost package -- costs must use integer HINCRBY only"
            exit 1
          fi
          echo "clean: no HINCRBYFLOAT/hincrByFloat in cost package"


      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: expense-api-test-reports
          path: build/reports/tests/
          retention-days: 7

  call-build-and-push:
    # On push to main only: drives the reusable workflow that builds
    # the image (Task 2), and will add Trivy + ECR push in Task 3.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build-test
    uses: ./.github/workflows/_build-and-push.yml
    permissions:
      contents: read
      id-token: write     # required to mint the OIDC token for AWS STS
    secrets: inherit      # threads GITOPS_REPO_TOKEN down to _bump-config.yml
    with:
      app-name:   expense-api
      image-name: uptimecrew/expense-api
      ecr-repo:   uptimecrew/expense-api
