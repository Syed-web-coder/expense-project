# .github/workflows/ci.yml
name: expense-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR force-pushes cancel stale runs; main pushes serialise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Top-level default: read-only. Individual jobs widen as needed.
permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (expense-api)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (required to load local composite action)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up build env (composite)
        uses: ./.github/actions/setup-build

      - name: Gradle build + tests
        run: ./gradlew --no-daemon build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: expense-api-test-reports
          path: build/reports/tests/
          retention-days: 7

  call-build-and-push:
    # On push to main only: drives the reusable workflow that builds
    # the image (Task 2), and will add Trivy + ECR push in Task 3.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build-test
    uses: ./.github/workflows/_build-and-push.yml
    permissions:
      contents: read
      id-token: write     # required to mint the OIDC token for AWS STS
    with:
      app-name:   expense-api
      image-name: uptimecrew/expense-api
      ecr-repo:   uptimecrew/expense-api
