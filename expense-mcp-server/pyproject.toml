# expense-mcp-server/pyproject.toml
# New uv project at the repo root; imports the W7 D3 sidecar
# (expense-ai) as a path dependency.

[project]
name = "expense-mcp-server"
version = "0.1.0"
description = "MCP server publishing four tools (orders.* , llm.chat , rag.retrieve_and_generate)."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",              # FastMCP, stdio + SSE transports, McpError
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "langsmith>=0.1.80",
    "structlog>=24.1",       # structured JSON logging on stderr
    # The W7 D3 sidecar as a path dependency (read-only library reuse):
    "expense_ai @ {root:uri}/../expense-ai",
]

[project.scripts]
expense-mcp-server = "expense_mcp_server.transports.stdio:main"
expense-mcp-server-sse = "expense_mcp_server.transports.sse:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/expense_mcp_server"]
