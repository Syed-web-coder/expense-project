# compose.profiles.yaml - sidecars activated via --profile <n>.

services:
  expense-web:
    profiles: [e2e]
    image: uptimecrew/expense-web:0.1.0
    networks: [expense_net]
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8080
    depends_on:
      expense-api: { condition: service_healthy }
    restart: unless-stopped

  seed-fixtures:
    profiles: [test]
    image: uptimecrew/expense-api:0.1.0
    networks: [expense_net]
    command: ["java", "-jar", "/app.jar", "--spring.profiles.active=seed"]
    env_file:
      - ./envs/expense.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expense_dev
      SPRING_DATASOURCE_USERNAME: expense_dev
      SPRING_DATASOURCE_PASSWORD: expense_dev_password
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  otelcol:
    profiles: [observability, e2e]
    image: otel/opentelemetry-collector-contrib:0.110.0
    networks: [expense_net]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - type: bind
        source: ./otelcol/config.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true

  jaeger:
    profiles: [observability, e2e]
    image: jaegertracing/all-in-one:1.62
    networks: [expense_net]
    ports:
      - "16686:16686"
