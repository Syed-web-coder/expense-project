plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot'          version '3.4.13'
    id 'io.spring.dependency-management'   version '1.1.7'
}

group   = 'com.uptimecrew.expense'
version = '0.1.0-SNAPSHOT'

ext['testcontainers.version'] = '1.21.4'
ext['spring-ai.version']      = '1.1.6'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // W6D4 Task 3: pgvector table migration. This project has no prior
    // Flyway integration (schema is otherwise hand-applied via db/init.sh);
    // this is the first-ever Flyway migration, hence V1 not V3.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // AWS SDK v2, for the W5D4 Lambda handler (DynamoDB) — BOM keeps all
    // software.amazon.awssdk modules on matching, compatible versions.
    implementation platform('software.amazon.awssdk:bom:2.47.1')
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'com.amazonaws:aws-lambda-java-core:1.4.0'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter:2.10.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-kafka-2.7:2.10.0-alpha'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.10.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.5.0'
    runtimeOnly    'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly    'org.postgresql:postgresql:42.7.11'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.postgresql:postgresql:42.7.11'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    implementation     'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation     'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'org.testcontainers:kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'com.bucket4j:bucket4j-redis:8.10.1'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'

    // --- W3D3: Kafka + outbox + DLQ ---
    implementation          'org.springframework.kafka:spring-kafka'
    testImplementation      'org.springframework.kafka:spring-kafka-test'
    testImplementation      'org.awaitility:awaitility:4.2.2'

    // --- W3D3: MCP server (exposes place_transaction etc. as a tool) ---
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
    implementation 'com.networknt:json-schema-validator:1.5.1'

    testImplementation 'org.springframework.graphql:spring-graphql-test'

    // --- W3D5: OpenTelemetry ---
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter:2.10.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-kafka-2.7:2.10.0-alpha'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.10.0'

    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
}

// Trivy-flagged transitive dependencies, forced to their fixed
// versions. mcp-core intentionally excluded here -- 0.17.0 -> 1.0.0
// crosses a major version boundary and needs its own compatibility
// pass, not a mechanical force. lz4-java also excluded -- forcing it
// hits a Gradle capability conflict against a historical fork
// (at.yawk.lz4:lz4-java) that needs its own resolution. See
// GITOPS.md / this commit message for the full CVE list.
configurations.all {
    resolutionStrategy {
        force 'commons-io:commons-io:2.14.0'
        force 'org.bouncycastle:bcprov-jdk18on:1.80.2'
        eachDependency { details ->
            if (details.requested.group == 'io.netty') {
                details.useVersion '4.1.135.Final'
            }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
         mavenBom "org.springframework.ai:spring-ai-bom:${ext['spring-ai.version']}"   
 }

    // Overrides for Trivy-flagged CVEs in dependencies Spring Boot's
    // own BOM manages. Plain Gradle resolutionStrategy.force does not
    // win against io.spring.dependency-management's own resolution --
    // these have to go through this plugin's override mechanism
    // instead. Discovered by testing: jackson-databind, commons-
    // fileupload, and tomcat-embed-core all silently kept their old
    // (vulnerable) versions under a plain force, while netty/commons-io/
    // bouncycastle (not Spring-BOM-managed) took the force correctly.
    //
    // kafka-clients (CVE-2026-35554) deliberately NOT overridden here:
    // forcing it to 3.9.2 breaks OrderEventDay3Lab's @EmbeddedKafka
    // tests with NoSuchMethodError at SocketServer.scala -- the Kafka
    // *broker* jars (kafka_2.13, kafka-server-common) that
    // spring-kafka-test's embedded broker relies on stay at 3.8.1
    // regardless, and a client/broker version split breaks the
    // embedded broker at test time. Syncing the whole Kafka jar
    // family is real work, not a mechanical bump -- left for the
    // same follow-up as spring-kafka's own CVE (both are tied to
    // the same underlying Kafka version ceiling).
    dependencies {
        dependency 'com.fasterxml.jackson.core:jackson-databind:2.18.8'
        dependency 'commons-fileupload:commons-fileupload:1.6.0'
        dependency 'org.apache.tomcat.embed:tomcat-embed-core:10.1.55'
    }
}


compileJava {
    options.release = 21
}

compileTestJava {
    options.release = 21
}

test {
    useJUnitPlatform()
    jvmArgs '-Dmockito.mock.maker=org.mockito.internal.creation.proxy.ProxyMockMaker'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required  = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                value   = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
