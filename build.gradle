plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot'          version '3.4.13'
    id 'io.spring.dependency-management'   version '1.1.7'
}

group   = 'com.uptimecrew.expense'
version = '0.1.0-SNAPSHOT'

ext['testcontainers.version'] = '1.21.4'
ext['spring-ai.version']      = '1.1.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // AWS SDK v2, for the W5D4 Lambda handler (DynamoDB) — BOM keeps all
    // software.amazon.awssdk modules on matching, compatible versions.
    implementation platform('software.amazon.awssdk:bom:2.47.1')
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'com.amazonaws:aws-lambda-java-core:1.4.0'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter:2.10.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-kafka-2.7:2.10.0-alpha'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.10.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly    'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly    'org.postgresql:postgresql:42.7.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.postgresql:postgresql:42.7.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    implementation     'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation     'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'org.testcontainers:kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'com.bucket4j:bucket4j-redis:8.10.1'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'

    // --- W3D3: Kafka + outbox + DLQ ---
    implementation          'org.springframework.kafka:spring-kafka'
    testImplementation      'org.springframework.kafka:spring-kafka-test'
    testImplementation      'org.awaitility:awaitility:4.2.2'

    // --- W3D3: MCP server (exposes place_transaction etc. as a tool) ---
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
    implementation 'com.networknt:json-schema-validator:1.5.1'

    testImplementation 'org.springframework.graphql:spring-graphql-test'

    // --- W3D5: OpenTelemetry ---
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter:2.10.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-kafka-2.7:2.10.0-alpha'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.10.0'

    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
}
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
         mavenBom "org.springframework.ai:spring-ai-bom:${ext['spring-ai.version']}"   
 }
} 

compileJava {
    options.release = 21
}

compileTestJava {
    options.release = 21
}

test {
    useJUnitPlatform()
    jvmArgs '-Dmockito.mock.maker=org.mockito.internal.creation.proxy.ProxyMockMaker'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required  = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                value   = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
