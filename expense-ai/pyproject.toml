[project]
name = "expense-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.30",
    "fastapi>=0.111",
    "httpx>=0.27",
    "langchain-core>=0.2",
    "langchain-text-splitters>=0.2",
    "langsmith>=0.1.80",
    "numpy>=2.0",
    "pandas>=2.2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "apache-airflow>=2.9",
    "great-expectations>=0.18",
    "jupyter>=1.0",
    "matplotlib>=3.9",
    "mypy>=1.10",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ragas>=0.1.10",
    "ruff>=0.5",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "testcontainers[postgres,redis]>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_ai"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Airflow is POSIX-only and ships without mypy stubs; exclude the DAG package.
module = ["expense_ai.dags.*"]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# matplotlib.use("Agg") must sit between the two import blocks — isort can't sort across it
"*.ipynb" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a live Postgres container",
    "slow: marks tests as slow (deselect with '-m not slow')",
]
