# Strategic-merge patch — apply over manifests/10-expense-api.deployment.yaml.
# kubectl apply -f manifests/10-expense-api.deployment.yaml \
#               -f manifests/observability/expense-api-deployment-patch.yaml
#
# Strategic merge rules used here:
#   volumes / initContainers  → merged by name (ADDs otel-agent / download-otel-agent)
#   containers[name=expense-api].volumeMounts → merged by name (ADDs otel-agent mount)
#   containers[name=expense-api].env → merged by name (JAVA_TOOL_OPTIONS replaces the
#     base value; all other env vars are new additions)
#
# JAVA_TOOL_OPTIONS preserves the JVM flags from the base Deployment so the strategic
# merge does not silently drop -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-api
  namespace: expense-dev
spec:
  template:
    spec:
      volumes:
      - name: otel-agent
        emptyDir: {}
      initContainers:
      - name: download-otel-agent
        image: curlimages/curl:8.7.1    # pinned — never :latest
        command:
        - sh
        - -c
        - |
          curl --silent --show-error --location \
            "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.5.0/opentelemetry-javaagent.jar" \
            -o /otel/opentelemetry-javaagent.jar
        volumeMounts:
        - name: otel-agent
          mountPath: /otel
      containers:
      - name: expense-api
        volumeMounts:
        - name: otel-agent
          mountPath: /otel
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
        - name: OTEL_SERVICE_NAME
          value: expense-api
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_traceidratio
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.1"
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: SPRING_PROFILES_ACTIVE
          value: prod,k8s
