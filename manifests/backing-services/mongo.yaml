# Dev-only MongoDB backing service for k3d.
# Storage is emptyDir — data is ephemeral, acceptable for local dev.
# No auth configured; the app connects via the plain URI in the ConfigMap:
#   mongodb://mongo.expense-dev.svc.cluster.local:27017/expense
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: expense-dev
  labels:
    app.kubernetes.io/name:      mongo
    app.kubernetes.io/part-of:   expense
    app.kubernetes.io/component: backing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name:      mongo
        app.kubernetes.io/part-of:   expense
        app.kubernetes.io/component: backing-service
    spec:
      containers:
      - name: mongo
        image: mongo:7
        ports:
        - { name: mongo, containerPort: 27017 }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 512Mi }
        volumeMounts:
        - name: data
          mountPath: /data/db
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: expense-dev
  labels:
    app.kubernetes.io/name:      mongo
    app.kubernetes.io/part-of:   expense
    app.kubernetes.io/component: backing-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongo
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
