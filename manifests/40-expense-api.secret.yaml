# manifests/40-expense-api.secret.yaml - secret env.
# Use `stringData` (plaintext input; Kubernetes base64-encodes for you)
# NOT `data` (hand-base64). The placeholder value is replaced in CI by
# a value pulled from a real secrets manager (External Secrets Operator
# in prod; kubectl-create from a CI secret here).
#
# DEV NOTE: The password below is a committed dev-only value for the k3d
# local cluster. The Postgres backing service (manifests/backing-services/
# postgres.yaml) reads the SAME key via secretKeyRef, so app and DB always
# agree with no manual seeding. For any real environment, override via:
#   kubectl create secret generic expense-api-secrets \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=$(pwgen -s 24 1) \
#     -n expense-dev --dry-run=client -o yaml \
#     > manifests/40-expense-api.secret.local.yaml
# and apply the .local copy (gitignored). This file MUST NOT hold a prod secret.
apiVersion: v1
kind: Secret
metadata:
  name: expense-api-secrets
  namespace: expense-dev
  labels:
    app.kubernetes.io/name: expense-api
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: expense-dev-k3d-local-2025
