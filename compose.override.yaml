# compose.override.yaml - local-dev tweaks. Auto-merged by Compose when
# present alongside compose.yaml. NEVER deployed.

services:
  expense-api:
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -Dspring.devtools.restart.poll-interval=1s
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_SCHEMAS: "expense"

  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: expense_dev
      POSTGRES_USER: expense_dev

  mongo:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  kafka:
    ports:
      - "29092:29092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT

  expense-api-dev:
    profiles: [dev]
    image: eclipse-temurin:21-jre-jammy
    networks: [expense_net]
    working_dir: /workspace
    command:
      - "sh"
      - "-c"
      - |
        java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 \
             -Dspring.devtools.restart.poll-interval=1s \
             -Dspring.devtools.restart.quiet-period=400ms \
             -jar build/libs/expense-api-*.jar
    ports:
      - "8081:8080"
      - "5006:5005"
    env_file:
      - ./envs/expense.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expense_dev
      SPRING_DATASOURCE_USERNAME: expense_dev
      SPRING_DATASOURCE_PASSWORD: expense_dev_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - type: bind
        source: ./expense-api
        target: /workspace
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
    restart: unless-stopped
